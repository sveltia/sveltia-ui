# Run the end-to-end tests of Sveltia CMS, the main consumer of this library, against the library
# as it would be published, so a change that breaks the CMS is caught before it’s released. The
# library is packed into a tarball, installed in place of the released version, and the CMS bundle
# built with it is tested the same way the CMS tests itself; see `.github/workflows/tests.yml` there

name: CMS End-to-End Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cms-ref:
        description: Branch, tag or commit of Sveltia CMS to test
        default: main

# The CMS installs and runs its own dependencies here, which only need to read this repository
permissions:
  contents: read

# A newer push supersedes a run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      # The commit the bundle is built from, so every shard tests the same one even if the branch
      # moves on in the meantime
      cms-sha: ${{ steps.cms.outputs.sha }}
    steps:
      # The CMS is checked out at the root, where `pnpm/setup` finds its lockfile to cache the
      # store, and the library in a folder of its own, which has its own `pnpm-workspace.yaml`
      - name: Checkout Sveltia CMS
        uses: actions/checkout@v7.0.1
        with:
          repository: sveltia/sveltia-cms
          ref: ${{ inputs.cms-ref || 'main' }}
          persist-credentials: false
      - name: Get the CMS commit
        id: cms
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
        with:
          path: sveltia-ui
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          version: latest
          runtime: node@26
          cache: true
      # `pnpm pack` doesn’t run `prepublishOnly`, so the library is built first
      - name: Build and pack the library
        working-directory: sveltia-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm pack --out ../sveltia-ui.tgz
      - name: Install the library in the CMS
        run: pnpm add @sveltia/ui@file:sveltia-ui.tgz
      - name: Build the CMS
        run: pnpm build
      - name: Upload the bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle
          # The library, the bundle, and the locale files the tests serve in place of the CDN
          path: |
            sveltia-ui.tgz
            package/dist/
            package/locales/
          overwrite: true
          retention-days: 7
  e2e:
    name: Test (end-to-end ${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # Let the other shards finish, so a run lists every test that fails
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout Sveltia CMS
        uses: actions/checkout@v7.0.1
        with:
          repository: sveltia/sveltia-cms
          ref: ${{ needs.build.outputs.cms-sha }}
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          version: latest
          runtime: node@26
          cache: true
      - name: Download the bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: bundle
      # The tests don’t import the library, but it’s installed all the same, so the dependency tree
      # is the one the bundle was built with
      - name: Install the library in the CMS
        run: pnpm add @sveltia/ui@file:sveltia-ui.tgz
      # The browser is cached per runner image and Playwright version, which together pin the
      # Chromium build, made for the image’s Ubuntu release. Only the headless shell is installed,
      # as in the CMS
      - name: Get the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: ${{ steps.chromium-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install chromium --only-shell --with-deps
      - name: Install Chromium dependencies
        if: ${{ steps.chromium-cache.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium-headless-shell
      - name: Test (end-to-end ${{ matrix.shard }}/6)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/6
      # The report holds a trace of each failed test, to step through what the page did
      - name: Upload the end-to-end test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-e2e-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
