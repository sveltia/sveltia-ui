# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish Package to npmjs

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          version: latest
          # 26.13.0 causes CI errors due to missing SHASUMS256.txt
          # https://nodejs.org/download/release/v26.13.0/
          runtime: node@26.12.1
          cache: true
      - name: Build & publish the app
        run: pnpm publish --no-git-checks
