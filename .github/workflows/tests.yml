name: Tests

on: push

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
          - name: Check
            command: pnpm check
          - name: Test
            command: pnpm test
            browser: true
          - name: Build
            command: pnpm build
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.1.2
        with:
          version: latest
          # 26.13.0 causes CI errors due to missing SHASUMS256.txt
          # https://nodejs.org/download/release/v26.13.0/
          runtime: node@26.12.1
          cache: true
      # The browsers are cached per Playwright version, which pins their builds. The tests run
      # headless, so only the headless shell of Chromium is installed, not the full browser. The
      # system packages they need aren’t cached, and are installed on every run
      - name: Get the Playwright version
        id: playwright
        if: ${{ matrix.task.browser }}
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        id: browser-cache
        if: ${{ matrix.task.browser }}
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers
        if: ${{ matrix.task.browser && steps.browser-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install chromium firefox webkit --only-shell --with-deps
      - name: Install the browser dependencies
        if: ${{ matrix.task.browser && steps.browser-cache.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium-headless-shell firefox webkit
      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}
