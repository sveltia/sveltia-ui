name: Tests

on: push

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task:
          - name: Check
            command: pnpm check
          - name: Test
            command: pnpm test
            browser: true
          - name: Build
            command: pnpm build
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7.0.1
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3.0.0
        with:
          version: latest
          runtime: node@26
          cache: true
      # The browser is cached per Playwright version, which pins the Chromium build. The tests run
      # headless, so only the headless shell is installed, not the full browser. The system packages
      # it needs aren’t cached, and are installed on every run
      - name: Get the Playwright version
        id: playwright
        if: ${{ matrix.task.browser }}
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium-cache
        if: ${{ matrix.task.browser }}
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: ${{ matrix.task.browser && steps.chromium-cache.outputs.cache-hit != 'true' }}
        run: pnpm exec playwright install chromium --only-shell --with-deps
      - name: Install Chromium dependencies
        if: ${{ matrix.task.browser && steps.chromium-cache.outputs.cache-hit == 'true' }}
        run: pnpm exec playwright install-deps chromium-headless-shell
      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}
