# Dialog action button labels
ok: OK
cancel: Cancelar
close: Fechar

# Button to clear content, e.g. search input or calendar date
clear: Limpar

# Text editor dialog buttons for link/image insertion
insert: Inserir
update: Atualizar
remove: Remover

# Combobox dropdown toggle button aria-labels
collapse: Recolher
expand: Expandir

# Infobar/toast dismiss button label
dismiss: Dispensar

# Alert & infobar status, read out by screen readers before the message (visually hidden)
alert:
  error: Erro
  warning: Aviso
  info: Informação
  success: Sucesso

# Role descriptions, read out by screen readers in place of the generic “group” role
role_descriptions:
  disclosure: seção expansível
  option_group: grupo de opções
  menu_item_group: grupo de itens de menu
  checkbox_group: grupo de caixas de seleção
  table_head: cabeçalho da tabela
  table_body: corpo da tabela
  table_foot: rodapé da tabela
  grid_head: cabeçalho da grade
  grid_body: corpo da grade
  grid_foot: rodapé da grade

# Emoji suggestion listbox aria-label, shared by the text fields and the text editor
emoji_suggestions: Sugestões de emoji

# Calendar component
calendar:
  # View switcher group aria-labels and navigation button aria-labels
  year: Ano
  previous_decade: Década anterior
  next_decade: Próxima década
  month: Mês
  previous_month: Mês anterior
  next_month: Próximo mês
  # “Today” button label in footer
  today: Hoje

# Split button component
split_button:
  # Wrapper aria-label, e.g. “Save Options” when primary button is “Save”
  x_options: Opções de {$name}
  # Dropdown toggle aria-label
  more_options: Mais opções

# Combobox component
combobox:
  # Placeholder when no option is selected
  select_an_option: Selecione uma opção…
  # Filter input aria-label
  filter_options: Filtrar opções
  # Empty state message when filter has no matches
  no_matching_options: Nenhuma opção correspondente encontrada

# Number input component
number_input:
  # Spin button aria-labels for incrementing/decrementing the number value
  increase: Aumentar
  decrease: Diminuir
  # Description of the allowed range when the number can’t be stepped, e.g. “From 1 to 10”
  range: De {$min} a {$max}
  # Description of the minimum value when the number can’t be stepped
  min: Mínimo {$min}
  # Description of the maximum value when the number can’t be stepped
  max: Máximo {$max}

# Password input component
password_input:
  # Visibility toggle button aria-labels
  show_password: Mostrar senha
  hide_password: Ocultar senha

# Secret input component (API keys, tokens, etc.)
secret_input:
  # Visibility toggle button aria-labels
  show_secret: Mostrar segredo
  hide_secret: Ocultar segredo

# Select tags component (multi-select)
select_tags:
  # Listbox aria-label
  selected_options: Opções selecionadas
  # Remove button aria-label, e.g. “Remove Option 1”
  remove_x: Remover {$name}

# Text editor component
text_editor:
  # Toolbar aria-labels
  text_editor: Editor de texto
  code_editor: Editor de código
  # Block style menu button and menu aria-labels
  text_style_options: Opções de estilo de texto
  show_text_style_options: Mostrar opções de estilo de texto
  # Block style menu items
  paragraph: Parágrafo
  heading_1: Título 1
  heading_2: Título 2
  heading_3: Título 3
  heading_4: Título 4
  heading_5: Título 5
  heading_6: Título 6
  bulleted_list: Lista com marcadores
  numbered_list: Lista numerada
  blockquote: Citação
  code_block: Bloco de código
  # Inline style button aria-labels
  bold: Negrito
  italic: Itálico
  strikethrough: Tachado
  code: Código
  link: Link
  # Link dialog title
  insert_link: Inserir link
  # Floating link editor button aria-labels
  edit_link: Editar link
  remove_link: Remover link
  # Link dialog input field labels
  text: Texto
  url: URL
  # Link dialog checkbox label and floating link editor button aria-label
  open_in_new_tab: Abrir em uma nova guia
  # Table dialog title
  insert_table: Inserir tabela
  # Table dialog input field labels
  rows: Linhas
  columns: Colunas
  # Table menu button and menu aria-labels
  table_options: Opções de tabela
  show_table_options: Mostrar opções de tabela
  # Table menu items
  insert_row_above: Inserir linha acima
  insert_row_below: Inserir linha abaixo
  insert_column_left: Inserir coluna à esquerda
  insert_column_right: Inserir coluna à direita
  delete_row: Excluir linha
  delete_column: Excluir coluna
  delete_table: Excluir tabela
  # Horizontal rule button aria-label
  insert_horizontal_rule: Inserir linha horizontal
  # Alignment menu button and menu aria-labels
  alignment_options: Opções de alinhamento
  show_alignment_options: Mostrar opções de alinhamento
  # Alignment menu items
  align_left: Alinhar à esquerda
  align_center: Centralizar
  align_right: Alinhar à direita
  align_justify: Justificar
  # Markdown mode toggle button aria-label
  edit_in_markdown: Editar em Markdown
  # HTML mode toggle button aria-label
  edit_in_html: Editar em HTML
  # Error message when rich text conversion fails
  converter_error: Não foi possível ativar o modo de texto formatado. Use o editor de texto simples.
  # Language selector aria-label
  language: Idioma
  # Plain text mode option in language selector
  plain_text: Texto simples
