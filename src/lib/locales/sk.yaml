# Dialog action button labels
ok: OK
cancel: Zrušiť
close: Zavrieť

# Button to clear content, e.g. search input or calendar date
clear: Vymazať

# Text editor dialog buttons for link/image insertion
insert: Vložiť
update: Aktualizovať
remove: Odobrať

# Combobox dropdown toggle button aria-labels
collapse: Zbaliť
expand: Rozbaliť

# Infobar/toast dismiss button label
dismiss: Zavrieť

# Alert & infobar status, read out by screen readers before the message (visually hidden)
alert:
  error: Chyba
  warning: Upozornenie
  info: Informácia
  success: Úspech

# Role descriptions, read out by screen readers in place of the generic “group” role
role_descriptions:
  disclosure: rozbaľovacia sekcia
  option_group: skupina možností
  menu_item_group: skupina položiek menu
  checkbox_group: skupina začiarkavacích políčok
  table_head: hlavička tabuľky
  table_body: telo tabuľky
  table_foot: päta tabuľky
  grid_head: hlavička mriežky
  grid_body: telo mriežky
  grid_foot: päta mriežky

# Emoji suggestion listbox aria-label, shared by the text fields and the text editor
emoji_suggestions: Návrhy emoji

# Calendar component
calendar:
  # View switcher group aria-labels and navigation button aria-labels
  year: Rok
  previous_decade: Predchádzajúce desaťročie
  next_decade: Nasledujúce desaťročie
  month: Mesiac
  previous_month: Predchádzajúci mesiac
  next_month: Nasledujúci mesiac
  # “Today” button label in footer
  today: Dnes

# Split button component
split_button:
  # Wrapper aria-label, e.g. “Save Options” when primary button is “Save”
  x_options: Možnosti pre {$name}
  # Dropdown toggle aria-label
  more_options: Ďalšie možnosti

# Combobox component
combobox:
  # Placeholder when no option is selected
  select_an_option: Vyberte možnosť…
  # Filter input aria-label
  filter_options: Filtrovať možnosti
  # Empty state message when filter has no matches
  no_matching_options: Nenašli sa žiadne zodpovedajúce možnosti

# Number input component
number_input:
  # Spin button aria-labels for incrementing/decrementing the number value
  increase: Zvýšiť
  decrease: Znížiť

# Password input component
password_input:
  # Visibility toggle button aria-labels
  show_password: Zobraziť heslo
  hide_password: Skryť heslo

# Secret input component (API keys, tokens, etc.)
secret_input:
  # Visibility toggle button aria-labels
  show_secret: Zobraziť tajný kľúč
  hide_secret: Skryť tajný kľúč

# Select tags component (multi-select)
select_tags:
  # Listbox aria-label
  selected_options: Vybrané možnosti
  # Remove button aria-label, e.g. “Remove Option 1”
  remove_x: Odobrať {$name}

# Text editor component
text_editor:
  # Toolbar aria-labels
  text_editor: Textový editor
  code_editor: Editor kódu
  # Block style menu button and menu aria-labels
  text_style_options: Možnosti formátovania textu
  show_text_style_options: Zobraziť možnosti formátovania textu
  # Block style menu items
  paragraph: Odsek
  heading_1: Nadpis 1
  heading_2: Nadpis 2
  heading_3: Nadpis 3
  heading_4: Nadpis 4
  heading_5: Nadpis 5
  heading_6: Nadpis 6
  bulleted_list: Zoznam s odrážkami
  numbered_list: Číslovaný zoznam
  blockquote: Citácia
  code_block: Blok kódu
  # Inline style button aria-labels
  bold: Tučné
  italic: Kurzíva
  strikethrough: Prečiarknuté
  code: Kód
  link: Odkaz
  # Link dialog title
  insert_link: Vložiť odkaz
  update_link: Aktualizovať odkaz
  # Link dialog input field labels
  text: Text
  url: URL
  # Markdown mode toggle button aria-label
  edit_in_markdown: Upraviť v Markdowne
  # Error message when rich text conversion fails
  converter_error: Režim formátovaného textu nie je možné zapnúť. Použite namiesto neho editor obyčajného textu.
  # Language selector aria-label
  language: Jazyk
  # Plain text mode option in language selector
  plain_text: Obyčajný text
