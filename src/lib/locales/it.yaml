# Dialog action button labels
ok: OK
cancel: Annulla
close: Chiudi

# Button to clear content, e.g. search input or calendar date
clear: Cancella

# Text editor dialog buttons for link/image insertion
insert: Inserisci
update: Aggiorna
remove: Rimuovi

# Combobox dropdown toggle button aria-labels
collapse: Comprimi
expand: Espandi

# Infobar/toast dismiss button label
dismiss: Ignora

# Alert & infobar status, read out by screen readers before the message (visually hidden)
alert:
  error: Errore
  warning: Avviso
  info: Informazione
  success: Operazione riuscita

# Role descriptions, read out by screen readers in place of the generic “group” role
role_descriptions:
  disclosure: sezione espandibile
  option_group: gruppo di opzioni
  menu_item_group: gruppo di voci di menu
  checkbox_group: gruppo di caselle di controllo
  table_head: intestazione tabella
  table_body: corpo tabella
  table_foot: piè di tabella
  grid_head: intestazione griglia
  grid_body: corpo griglia
  grid_foot: piè di griglia

# Emoji suggestion listbox aria-label, shared by the text fields and the text editor
emoji_suggestions: Suggerimenti Emoji

# Calendar component
calendar:
  # View switcher group aria-labels and navigation button aria-labels
  year: Anno
  previous_decade: Decennio Precedente
  next_decade: Decennio Successivo
  month: Mese
  previous_month: Mese Precedente
  next_month: Mese Successivo
  # “Today” button label in footer
  today: Oggi

# Split button component
split_button:
  # Wrapper aria-label, e.g. “Save Options” when primary button is “Save”
  x_options: Opzioni {$name}
  # Dropdown toggle aria-label
  more_options: Altre Opzioni

# Combobox component
combobox:
  # Placeholder when no option is selected
  select_an_option: Seleziona un’opzione…
  # Filter input aria-label
  filter_options: Filtra Opzioni
  # Empty state message when filter has no matches
  no_matching_options: Nessuna opzione corrispondente trovata

# Number input component
number_input:
  # Spin button aria-labels for incrementing/decrementing the number value
  increase: Aumenta
  decrease: Diminuisci

# Password input component
password_input:
  # Visibility toggle button aria-labels
  show_password: Mostra Password
  hide_password: Nascondi Password

# Secret input component (API keys, tokens, etc.)
secret_input:
  # Visibility toggle button aria-labels
  show_secret: Mostra Segreto
  hide_secret: Nascondi Segreto

# Select tags component (multi-select)
select_tags:
  # Listbox aria-label
  selected_options: Opzioni Selezionate
  # Remove button aria-label, e.g. “Remove Option 1”
  remove_x: Rimuovi {$name}

# Text editor component
text_editor:
  # Toolbar aria-labels
  text_editor: Editor di Testo
  code_editor: Editor di Codice
  # Block style menu button and menu aria-labels
  text_style_options: Opzioni Stile Testo
  show_text_style_options: Mostra Opzioni Stile Testo
  # Block style menu items
  paragraph: Paragrafo
  heading_1: Titolo 1
  heading_2: Titolo 2
  heading_3: Titolo 3
  heading_4: Titolo 4
  heading_5: Titolo 5
  heading_6: Titolo 6
  bulleted_list: Elenco Puntato
  numbered_list: Elenco Numerato
  blockquote: Citazione
  code_block: Blocco di Codice
  # Inline style button aria-labels
  bold: Grassetto
  italic: Corsivo
  strikethrough: Barrato
  code: Codice
  link: Link
  # Link dialog title
  insert_link: Inserisci Link
  update_link: Aggiorna Link
  # Link dialog input field labels
  text: Testo
  url: URL
  # Markdown mode toggle button aria-label
  edit_in_markdown: Modifica in Markdown
  # Error message when rich text conversion fails
  converter_error: Impossibile abilitare la modalità rich text. Usa l’editor di testo semplice.
  # Language selector aria-label
  language: Lingua
  # Plain text mode option in language selector
  plain_text: Testo Semplice
