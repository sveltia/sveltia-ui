# Dialog action button labels
ok: OK
cancel: キャンセル
close: 閉じる

# Button to clear content, e.g. search input or calendar date
clear: クリア

# Text editor dialog buttons for link/image insertion
insert: 挿入
update: 更新
remove: 削除

# Combobox dropdown toggle button aria-labels
collapse: 折り畳む
expand: 広げる

# Infobar/toast dismiss button label
dismiss: 閉じる

# Alert & infobar status, read out by screen readers before the message (visually hidden)
alert:
  error: エラー
  warning: 警告
  info: 情報
  success: 成功

# Role descriptions, read out by screen readers in place of the generic “group” role
role_descriptions:
  disclosure: 折りたたみセクション
  option_group: オプショングループ
  menu_item_group: メニュー項目グループ
  checkbox_group: チェックボックスグループ
  table_head: テーブルヘッダー
  table_body: テーブル本体
  table_foot: テーブルフッター
  grid_head: グリッドヘッダー
  grid_body: グリッド本体
  grid_foot: グリッドフッター

# Emoji suggestion listbox aria-label, shared by the text fields and the text editor
emoji_suggestions: 絵文字の候補

# Calendar component
calendar:
  # View switcher group aria-labels and navigation button aria-labels
  year: 年
  previous_decade: 前の 10 年
  next_decade: 次の 10 年
  month: 月
  previous_month: 前月
  next_month: 翌月
  # "Today" button label in footer
  today: 今日

# Split button component
split_button:
  # Wrapper aria-label, e.g. "Save Options" when primary button is "Save"
  x_options: '{$name} オプション'
  # Dropdown toggle aria-label
  more_options: その他のオプション

# Combobox component
combobox:
  # Placeholder when no option is selected
  select_an_option: オプションを選択…
  # Filter input aria-label
  filter_options: オプションを絞り込み
  # Empty state message when filter has no matches
  no_matching_options: 一致するオプションは見つかりませんでした

# Number input component
number_input:
  # Spin button aria-labels for incrementing/decrementing the number value
  increase: 増やす
  decrease: 減らす
  # Description of the allowed range when the number can't be stepped, e.g. "From 1 to 10"
  range: '{$min} から {$max} まで'
  # Description of the minimum value when the number can't be stepped
  min: 最小値 {$min}
  # Description of the maximum value when the number can't be stepped
  max: 最大値 {$max}

# Password input component
password_input:
  # Visibility toggle button aria-labels
  show_password: パスワードを表示
  hide_password: パスワードを隠す

# Secret input component (API keys, tokens, etc.)
secret_input:
  # Visibility toggle button aria-labels
  show_secret: シークレットを表示
  hide_secret: シークレットを隠す

# Select tags component (multi-select)
select_tags:
  # Listbox aria-label
  selected_options: 選択済みのオプション
  # Remove button aria-label, e.g. "Remove Option 1"
  remove_x: '{$name} を削除'

# Text editor component
text_editor:
  # Toolbar aria-labels
  text_editor: テキストエディター
  code_editor: コードエディター
  # Block style menu button and menu aria-labels
  text_style_options: テキストスタイルオプション
  show_text_style_options: テキストスタイルオプションを表示
  # Block style menu items
  paragraph: 段落
  heading_1: 見出し 1
  heading_2: 見出し 2
  heading_3: 見出し 3
  heading_4: 見出し 4
  heading_5: 見出し 5
  heading_6: 見出し 6
  bulleted_list: 番号なしリスト
  numbered_list: 番号付きリスト
  blockquote: ブロック引用
  code_block: コードブロック
  # Inline style button aria-labels
  bold: 太字
  italic: 斜体
  strikethrough: 取り消し線
  code: コード
  link: リンク
  # Link dialog title
  insert_link: リンクを挿入
  # Floating link editor button aria-labels
  edit_link: リンクを編集
  remove_link: リンクを削除
  # Link dialog input field labels
  text: テキスト
  url: URL
  # Link dialog checkbox label and floating link editor button aria-label
  open_in_new_tab: 新しいタブで開く
  # Table dialog title
  insert_table: 表を挿入
  # Table dialog input field labels
  rows: 行数
  columns: 列数
  # Table menu button and menu aria-labels
  table_options: 表のオプション
  show_table_options: 表のオプションを表示
  # Table menu items
  insert_row_above: 上に行を挿入
  insert_row_below: 下に行を挿入
  insert_column_left: 左に列を挿入
  insert_column_right: 右に列を挿入
  delete_row: 行を削除
  delete_column: 列を削除
  delete_table: 表を削除
  # Horizontal rule button aria-label
  insert_horizontal_rule: 水平線を挿入
  # Alignment menu button and menu aria-labels
  alignment_options: 配置のオプション
  show_alignment_options: 配置のオプションを表示
  # Alignment menu items
  align_left: 左揃え
  align_center: 中央揃え
  align_right: 右揃え
  align_justify: 両端揃え
  # Markdown mode toggle button aria-label
  edit_in_markdown: マークダウンで編集
  # HTML mode toggle button aria-label
  edit_in_html: HTML で編集
  # Error message when rich text conversion fails
  converter_error: リッチテキストモードを有効にできませんでした。プレーンテキストエディターを使用してください。
  # Language selector aria-label
  language: 言語
  # Plain text mode option in language selector
  plain_text: プレーンテキスト
