# Dialog action button labels
ok: OK
cancel: Annuller
close: Luk

# Button to clear content, e.g. search input or calendar date
clear: Ryd

# Text editor dialog buttons for link/image insertion
insert: Indsæt
update: Opdater
remove: Fjern

# Combobox dropdown toggle button aria-labels
collapse: Fold sammen
expand: Fold ud

# Infobar/toast dismiss button label
dismiss: Afvis

# Alert & infobar status, read out by screen readers before the message (visually hidden)
alert:
  error: Fejl
  warning: Advarsel
  info: Information
  success: Succes

# Role descriptions, read out by screen readers in place of the generic “group” role
role_descriptions:
  disclosure: udvidelig sektion
  option_group: gruppe af valgmuligheder
  menu_item_group: gruppe af menupunkter
  checkbox_group: gruppe af afkrydsningsfelter
  table_head: tabelhoved
  table_body: tabelindhold
  table_foot: tabelfod
  grid_head: gitterhoved
  grid_body: gitterindhold
  grid_foot: gitterfod

# Emoji suggestion listbox aria-label, shared by the text fields and the text editor
emoji_suggestions: Emojiforslag

# Calendar component
calendar:
  # View switcher group aria-labels and navigation button aria-labels
  year: År
  previous_decade: Forrige årti
  next_decade: Næste årti
  month: Måned
  previous_month: Forrige måned
  next_month: Næste måned
  # “Today” button label in footer
  today: I dag

# Split button component
split_button:
  # Wrapper aria-label, e.g. “Save Options” when primary button is “Save”
  x_options: Muligheder for {$name}
  # Dropdown toggle aria-label
  more_options: Flere muligheder

# Combobox component
combobox:
  # Placeholder when no option is selected
  select_an_option: Vælg en mulighed…
  # Filter input aria-label
  filter_options: Filtrér muligheder
  # Empty state message when filter has no matches
  no_matching_options: Ingen matchende muligheder fundet

# Number input component
number_input:
  # Spin button aria-labels for incrementing/decrementing the number value
  increase: Forøg
  decrease: Formindsk
  # Description of the allowed range when the number can’t be stepped, e.g. “From 1 to 10”
  range: Fra {$min} til {$max}
  # Description of the minimum value when the number can’t be stepped
  min: Minimum {$min}
  # Description of the maximum value when the number can’t be stepped
  max: Maksimum {$max}

# Password input component
password_input:
  # Visibility toggle button aria-labels
  show_password: Vis adgangskode
  hide_password: Skjul adgangskode

# Secret input component (API keys, tokens, etc.)
secret_input:
  # Visibility toggle button aria-labels
  show_secret: Vis hemmelighed
  hide_secret: Skjul hemmelighed

# Select tags component (multi-select)
select_tags:
  # Listbox aria-label
  selected_options: Valgte muligheder
  # Remove button aria-label, e.g. “Remove Option 1”
  remove_x: Fjern {$name}

# Text editor component
text_editor:
  # Toolbar aria-labels
  text_editor: Teksteditor
  code_editor: Kodeeditor
  # Block style menu button and menu aria-labels
  text_style_options: Muligheder for tekststil
  show_text_style_options: Vis muligheder for tekststil
  # Block style menu items
  paragraph: Afsnit
  heading_1: Overskrift 1
  heading_2: Overskrift 2
  heading_3: Overskrift 3
  heading_4: Overskrift 4
  heading_5: Overskrift 5
  heading_6: Overskrift 6
  bulleted_list: Punktopstilling
  numbered_list: Nummereret liste
  blockquote: Citat
  code_block: Kodeblok
  # Inline style button aria-labels
  bold: Fed
  italic: Kursiv
  strikethrough: Gennemstreget
  code: Kode
  link: Link
  # Link dialog title
  insert_link: Indsæt link
  # Floating link editor button aria-labels
  edit_link: Rediger link
  remove_link: Fjern link
  # Link dialog input field labels
  text: Tekst
  url: URL
  # Link dialog checkbox label and floating link editor button aria-label
  open_in_new_tab: Åbn i ny fane
  # Table dialog title
  insert_table: Indsæt tabel
  # Table dialog input field labels
  rows: Rækker
  columns: Kolonner
  # Table menu button and menu aria-labels
  table_options: Muligheder for tabel
  show_table_options: Vis muligheder for tabel
  # Table menu items
  insert_row_above: Indsæt række over
  insert_row_below: Indsæt række under
  insert_column_left: Indsæt kolonne til venstre
  insert_column_right: Indsæt kolonne til højre
  delete_row: Slet række
  delete_column: Slet kolonne
  delete_table: Slet tabel
  # Horizontal rule button aria-label
  insert_horizontal_rule: Indsæt vandret linje
  # Alignment menu button and menu aria-labels
  alignment_options: Muligheder for justering
  show_alignment_options: Vis muligheder for justering
  # Alignment menu items
  align_left: Venstrejuster
  align_center: Centrer
  align_right: Højrejuster
  align_justify: Lige margener
  # Markdown mode toggle button aria-label
  edit_in_markdown: Rediger i Markdown
  # HTML mode toggle button aria-label
  edit_in_html: Rediger i HTML
  # Error message when rich text conversion fails
  converter_error: Formateret tekst kunne ikke slås til. Brug editoren til ren tekst i stedet.
  # Language selector aria-label
  language: Sprog
  # Plain text mode option in language selector
  plain_text: Ren tekst
