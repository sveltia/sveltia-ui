# Dialog action button labels
ok: Đồng ý
cancel: Hủy
close: Đóng

# Button to clear content, e.g. search input or calendar date
clear: Xóa

# Text editor dialog buttons for link/image insertion
insert: Chèn
update: Cập nhật
remove: Xóa

# Combobox dropdown toggle button aria-labels
collapse: Thu gọn
expand: Mở rộng

# Infobar/toast dismiss button label
dismiss: Đóng

# Alert & infobar status, read out by screen readers before the message (visually hidden)
alert:
  error: Lỗi
  warning: Cảnh báo
  info: Thông tin
  success: Thành công

# Role descriptions, read out by screen readers in place of the generic “group” role
role_descriptions:
  disclosure: phần có thể mở rộng
  option_group: nhóm tùy chọn
  menu_item_group: nhóm mục menu
  checkbox_group: nhóm hộp kiểm
  table_head: đầu bảng
  table_body: thân bảng
  table_foot: chân bảng
  grid_head: đầu lưới
  grid_body: thân lưới
  grid_foot: chân lưới

# Emoji suggestion listbox aria-label, shared by the text fields and the text editor
emoji_suggestions: Gợi ý biểu tượng cảm xúc

# Calendar component
calendar:
  # View switcher group aria-labels and navigation button aria-labels
  year: Năm
  previous_decade: Thập kỷ trước
  next_decade: Thập kỷ sau
  month: Tháng
  previous_month: Tháng trước
  next_month: Tháng sau
  # “Today” button label in footer
  today: Hôm nay

# Split button component
split_button:
  # Wrapper aria-label, e.g. “Save Options” when primary button is “Save”
  x_options: Tùy chọn cho {$name}
  # Dropdown toggle aria-label
  more_options: Tùy chọn khác

# Combobox component
combobox:
  # Placeholder when no option is selected
  select_an_option: Chọn một tùy chọn…
  # Filter input aria-label
  filter_options: Lọc tùy chọn
  # Empty state message when filter has no matches
  no_matching_options: Không tìm thấy tùy chọn phù hợp

# Number input component
number_input:
  # Spin button aria-labels for incrementing/decrementing the number value
  increase: Tăng
  decrease: Giảm
  # Description of the allowed range when the number can’t be stepped, e.g. “From 1 to 10”
  range: Từ {$min} đến {$max}
  # Description of the minimum value when the number can’t be stepped
  min: Tối thiểu {$min}
  # Description of the maximum value when the number can’t be stepped
  max: Tối đa {$max}

# Password input component
password_input:
  # Visibility toggle button aria-labels
  show_password: Hiện mật khẩu
  hide_password: Ẩn mật khẩu

# Secret input component (API keys, tokens, etc.)
secret_input:
  # Visibility toggle button aria-labels
  show_secret: Hiện mã bí mật
  hide_secret: Ẩn mã bí mật

# Select tags component (multi-select)
select_tags:
  # Listbox aria-label
  selected_options: Các tùy chọn đã chọn
  # Remove button aria-label, e.g. “Remove Option 1”
  remove_x: Xóa {$name}

# Text editor component
text_editor:
  # Toolbar aria-labels
  text_editor: Trình soạn thảo văn bản
  code_editor: Trình soạn thảo mã
  # Block style menu button and menu aria-labels
  text_style_options: Tùy chọn kiểu văn bản
  show_text_style_options: Hiện tùy chọn kiểu văn bản
  # Block style menu items
  paragraph: Đoạn văn
  heading_1: Tiêu đề 1
  heading_2: Tiêu đề 2
  heading_3: Tiêu đề 3
  heading_4: Tiêu đề 4
  heading_5: Tiêu đề 5
  heading_6: Tiêu đề 6
  bulleted_list: Dấu đầu dòng
  numbered_list: Đánh số
  blockquote: Trích dẫn
  code_block: Khối mã
  # Inline style button aria-labels
  bold: In đậm
  italic: In nghiêng
  strikethrough: Gạch ngang
  code: Mã
  link: Liên kết
  # Link dialog title
  insert_link: Chèn liên kết
  # Floating link editor button aria-labels
  edit_link: Chỉnh sửa liên kết
  remove_link: Xóa liên kết
  # Link dialog input field labels
  text: Văn bản
  url: URL
  # Link dialog checkbox label and floating link editor button aria-label
  open_in_new_tab: Mở trong thẻ mới
  # Table dialog title
  insert_table: Chèn bảng
  # Table dialog input field labels
  rows: Số hàng
  columns: Số cột
  # Table menu button and menu aria-labels
  table_options: Tùy chọn bảng
  show_table_options: Hiện tùy chọn bảng
  # Table menu items
  insert_row_above: Chèn hàng phía trên
  insert_row_below: Chèn hàng phía dưới
  insert_column_left: Chèn cột bên trái
  insert_column_right: Chèn cột bên phải
  delete_row: Xóa hàng
  delete_column: Xóa cột
  delete_table: Xóa bảng
  # Horizontal rule button aria-label
  insert_horizontal_rule: Chèn đường kẻ ngang
  # Alignment menu button and menu aria-labels
  alignment_options: Tùy chọn căn lề
  show_alignment_options: Hiện tùy chọn căn lề
  # Alignment menu items
  align_left: Căn trái
  align_center: Căn giữa
  align_right: Căn phải
  align_justify: Căn đều
  # Markdown mode toggle button aria-label
  edit_in_markdown: Chỉnh sửa bằng Markdown
  # HTML mode toggle button aria-label
  edit_in_html: Chỉnh sửa bằng HTML
  # Error message when rich text conversion fails
  converter_error: Không thể bật chế độ văn bản đa định dạng. Vui lòng sử dụng trình soạn thảo văn bản thuần.
  # Language selector aria-label
  language: Ngôn ngữ
  # Plain text mode option in language selector
  plain_text: Văn bản thuần
