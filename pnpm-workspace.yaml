allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  svelte-preprocess: true
  unrs-resolver: false

engineStrict: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@sveltia/*'

overrides:
  # <0.7.0 has a security vulnerability, 2.0.0 causes issues with SvelteKit
  'cookie@<0.7.0': '^1.0.0'

auditConfig:
  ignoreGhsas:
    # dev dependencies only, ignore for now
    # https://github.com/advisories/GHSA-mh99-v99m-4gvg
    - GHSA-mh99-v99m-4gvg
