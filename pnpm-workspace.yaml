# cSpell:ignore deepmerge gcqx

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  svelte-preprocess: true
  unrs-resolver: false

auditConfig:
  ignoreGhsas:
    # deepmerge: low severity, unpatched
    # https://github.com/advisories/GHSA-gcqx-w48m-w2h4
    - GHSA-gcqx-w48m-w2h4

engineStrict: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@sveltia/*'

overrides:
  # <0.7.0 has a security vulnerability, 2.0.0 causes issues with SvelteKit
  'cookie@<0.7.0': '^1.0.0'
  # Work around JSDoc bug
  esrap: 2.3.4
