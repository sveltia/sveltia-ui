allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  svelte-preprocess: true
  unrs-resolver: false

engineStrict: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@sveltia/*'

overrides:
  # https://github.com/advisories/GHSA-rgw5-rvv9-x895
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  # <0.7.0 has a security vulnerability, 2.0.0 causes issues with SvelteKit
  'cookie@<0.7.0': '^1.0.0'
